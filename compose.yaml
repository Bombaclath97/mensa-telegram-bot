services:
  # Single service replacing the legacy bot + crud pair. Serves plain HTTP behind
  # a reverse proxy that terminates TLS; the SQLite database lives on a named volume.
  mensa-bot:
    build: ./mensa-bot-refactor
    container_name: mensa-bot
    env_file: ./mensa-bot-refactor/.env
    environment:
      # Keep state on the mounted volume regardless of what .env says.
      DB_PATH: /data/mensa-telegram.db
      TOLGEE_CACHE_PATH: /data/tolgee-cache.json
      HTTP_ADDR: ":8080"
    ports:
      # host:container — publish the plain-HTTP port for the reverse proxy.
      - "8080:8080"
    volumes:
      - mensa-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mensa-data:
